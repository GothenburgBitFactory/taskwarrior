[package]
name = "taskchampion-lib"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88.0"  # MSRV

[lib]
crate-type = ["staticlib"]

[dependencies]
taskchampion = { git = "https://github.com/carmiac/taskchampion", rev = "44c7687b4576d95e580e3666ab38d407e857a3eb", features = ["server-git", "iterative-tasks"] }
cxx = "1.0.133"
tokio = { version = "1", features = [ "rt" ] }

[features]
# use native CA roots, instead of bundled
tls-native-roots = ["taskchampion/tls-native-roots"]

[build-dependencies]
cxx-build = "1.0.133"

[dev-dependencies]
tempfile = "3"
